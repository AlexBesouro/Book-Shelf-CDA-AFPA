# Checks run automatically on every `git commit`.
# Install: poetry run pre-commit install
# Run manually on the whole repo: poetry run pre-commit run --all-files
repos:
  # General checks on all files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace      # trailing spaces at end of lines
      - id: end-of-file-fixer        # single newline at end of file
      - id: check-yaml               # valid YAML
      - id: check-toml               # valid TOML (pyproject.toml)
      - id: check-added-large-files  # no large file added by mistake
      - id: detect-private-key       # no private key committed
      - id: check-merge-conflict     # no leftover <<<<<<< markers

  # Ruff: lint (with auto-fix) then format — same version as in pyproject.toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy: run inside the Poetry environment so it sees the project's dependencies
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]
